name: Build Desktop & Browser Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Standalone Binary (Windows / macOS / Linux)
        run: |
          pyinstaller --noconsole --windowed --onefile --name "JellyTimer" jelly_timer.pyw

      - name: Package Browser Extension ZIP
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd browser_extension
          zip -r ../dist/JellyTimer-Browser-Extension.zip .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JellyTimer-${{ matrix.os }}
          path: dist/*
